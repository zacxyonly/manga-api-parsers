user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" cache_status=$upstream_cache_status';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Image Proxy Cache Zone (500MB disk cache, 10MB keys in RAM)
    proxy_cache_path /var/cache/nginx/images
                     levels=1:2
                     keys_zone=manga_images:20m
                     max_size=1g
                     inactive=24h
                     use_temp_path=off;

    upstream ktor_backend {
        server api-manga:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # ── Image Proxy Endpoint (High Performance Caching) ───────────────────
        # When clients request /api/proxy, Nginx caches the images on disk.
        # Repeated views of chapters hit disk cache directly without touching JVM!
        location /api/proxy {
            proxy_pass http://ktor_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache manga_images;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=86400, immutable" always;
        }

        # ── General API & Admin Routes ────────────────────────────────────────
        location / {
            proxy_pass http://ktor_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
