services:

  api-manga:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    image: api-manga:2.0.0
    container_name: api-manga
    restart: unless-stopped

    # If running standalone without nginx, expose directly on HOST_PORT
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"

    environment:
      # ── Server ──────────────────────────────────────────────────────────────
      PORT: ${PORT:-8080}

      # ── Persistence ─────────────────────────────────────────────────────────
      API_KEYS_FILE: /app/data/api_keys.json

      # ── CORS ────────────────────────────────────────────────────────────────
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

      # ── Cache Configuration ─────────────────────────────────────────────────
      CACHE_MAX_ENTRIES:    ${CACHE_MAX_ENTRIES:-5000}
      CACHE_TTL_LIST_SEC:   ${CACHE_TTL_LIST_SEC:-300}
      CACHE_TTL_DETAIL_SEC: ${CACHE_TTL_DETAIL_SEC:-600}
      CACHE_TTL_TAGS_SEC:   ${CACHE_TTL_TAGS_SEC:-3600}
      CACHE_TTL_PAGES_SEC:  ${CACHE_TTL_PAGES_SEC:-1800}

    volumes:
      - api_keys_data:/app/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Optional production reverse proxy (Level 2 Architecture)
  # Provides disk caching for image proxy (/api/proxy) & gzip compression
  nginx:
    image: nginx:alpine
    container_name: api-manga-nginx
    restart: unless-stopped
    profiles: ["proxy", "all"]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx/images
    depends_on:
      api-manga:
        condition: service_healthy

volumes:
  api_keys_data:
    driver: local
  nginx_cache:
    driver: local
